name: Docker image CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build --tag california-housing-ui:ci .

      - name: Start container
        run: docker run --detach --name california-housing-ui-ci --publish 8501:8501 california-housing-ui:ci

      - name: Validate Streamlit and model prediction
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs california-housing-ui-ci
              exit 1
            fi
            sleep 2
          done

          docker exec california-housing-ui-ci python -c "import math, mlflow.pyfunc; model = mlflow.pyfunc.load_model('/app/model'); prediction = float(model.predict([[8.3252, 41, 6.9841, 1.0238, 322, 2.5556, 37.88, -122.23]])[0]); print(f'Sample prediction: {prediction}'); assert math.isfinite(prediction)"

      - name: Remove container
        if: always()
        run: docker rm --force california-housing-ui-ci 2>/dev/null || true
